[project]
name = "astro-pipeline"
version = "0.1.0"
description = "Automated, checkpointed LRGB/narrowband astrophotography processing pipeline (calibration through 16-bit TIFF export)"
readme = "README.md"
authors = [{name = "Kaveh Shahabi"}]
license = "MIT"
keywords = ["astrophotography", "astronomy", "siril", "fits", "itelescope"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "astropy>=6.0",
    "reproject>=0.13",
    "photutils>=1.13",
    "tifffile>=2024.5",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/kaveh096/astro-pipeline"
Issues = "https://github.com/kaveh096/astro-pipeline/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "m51_pipeline: real Siril run against the live M51 project; excluded by default (see the module docstring on the four tests this marks in tests/test_pipeline.py)",
]
addopts = ["-m", "not m51_pipeline"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
